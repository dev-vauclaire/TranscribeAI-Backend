[project]
name = "dispatcher"
version = "0.1.0"
description = "Application chargée de distribuer les jobs de transcription"
readme = "README.md"
authors = [
    { name = "dev-vauclaire", email = "dev@ch-vauclaire.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "transcribe-ai-shared",
]

[tool.uv.sources]
transcribe-ai-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
