[project]
name = "migration"
version = "0.1.0"
description = "Application chargée des migrations de base de données"
readme = "README.md"
authors = [
    { name = "dev-vauclaire", email = "dev@ch-vauclaire.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5,<2",
    "sqlalchemy>=2.0.51,<3",
    "transcribe-ai-shared",
]

[project.scripts]
database-migrate = "migration.main:main"

[tool.uv.sources]
transcribe-ai-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
