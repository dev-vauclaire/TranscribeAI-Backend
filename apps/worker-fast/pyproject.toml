[project]
name = "worker-fast"
version = "0.1.0"
description = "Worker consommant les jobs du stream de transcription FAST"
readme = "README.md"
authors = [
    { name = "dev-vauclaire", email = "dev@ch-vauclaire.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "transcribe-ai-shared",
]

[project.optional-dependencies]
cpu = [
    "faster-whisper>=1.2.1,<2",
]
gpu = [
    "faster-whisper>=1.2.1,<2",
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]

[tool.uv.sources]
transcribe-ai-shared = { workspace = true }

[project.scripts]
worker-fast = "worker_fast.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
