[project]
name = "worker-fast"
version = "0.1.0"
description = "Worker de transcription rapide exécutant les modèles dans son processus"
readme = "README.md"
authors = [
    { name = "dev-vauclaire", email = "dev@ch-vauclaire.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0,<2",
    "transcribe-ai-shared",
]

[tool.uv.sources]
transcribe-ai-shared = { workspace = true }

[project.scripts]
worker-fast = "worker_fast.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
